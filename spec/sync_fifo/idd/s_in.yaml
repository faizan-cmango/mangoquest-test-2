idd: IDD-S_IN
version: "0.3"
block: sync_fifo
side: slave
protocol_class: valid-ready
sad_section: "3.1"
clock: core_clk
reset: rst_n
ports:
  - {name: in_valid, dir: in, width: 1, type: logic, req: REQ-3.1.2, reset_value: n/a, meaning: "producer has a word to enqueue"}
  - {name: in_data, dir: in, width: 32, type: logic, req: REQ-3.1.3, reset_value: n/a, meaning: "word to enqueue, sampled at a transfer edge"}
  - {name: in_ready, dir: out, width: 1, type: logic, req: REQ-3.1.5, reset_value: 0, meaning: "FIFO can accept a word this cycle; follows out_ready combinationally only while the FIFO holds 16 words"}
omitted_signals: []
rules:
  - {id: R1, holder: environment, req: REQ-3.1.2, text: "The producer may change in_valid and in_data at any cycle; no hold-until-ready is required by the FIFO."}
  - {id: R2, holder: block, req: REQ-3.1.7, text: "While the FIFO holds 16 words, in_ready equals out_ready in the same cycle. This is the only combinational path from an input to an output."}
  - {id: R3, holder: block, req: REQ-3.3.2, text: "in_ready never depends combinationally on in_valid, in_data or rst_n."}
  - {id: R4, holder: environment, req: REQ-3.3.2, text: "The consumer must not drive out_ready combinationally from in_ready, or a combinational loop results."}
timing:
  - {req: REQ-3.1.8, clock: core_clk, from: "edge accepting a word into an empty FIFO", to: "out_valid is 1 with that word on out_data", cycles: 1, text: "one-cycle latency from accept to visibility; no write-through."}
  - {req: REQ-3.2.2, clock: core_clk, from: "first edge with rst_n 0", to: "in_ready is 0", cycles: 1, text: "in_ready takes its reset value at the first edge with rst_n 0."}
corner_cases:
  - {id: C1, req: REQ-3.1.7, text: "FIFO full: in_ready follows out_ready in the same cycle, going 1 and 0 with it without a clock edge.", vps: VPS-08}
  - {id: C2, req: REQ-3.1.6, text: "FIFO full with in_valid, out_ready both 1: the word is accepted and the oldest released at one edge, with no bubble.", vps: VPS-07}
  - {id: C3, req: REQ-3.2.2, text: "Release of reset: in_ready stays 0 until the first edge with rst_n 1, then is 1 on the empty FIFO.", vps: VPS-01}
  - {id: C4, req: REQ-3.2.3, text: "Reset applied while words are held: they are discarded.", vps: VPS-11}
registers: []
errata_applied: []
