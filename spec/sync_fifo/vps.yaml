vps: spec/sync_fifo/vps.yaml@v0.1
block: sync_fifo
scenarios:
  - id: VPS-01
    slug: reset_state
    req_ids: [REQ-3.2.2, REQ-3.2.4]
    observe: [IDD-S_IN.in_ready, IDD-M_OUT.out_valid, IDD-M_OUT.out_data]
    intent: "Hold rst_n at 0 for several cycles with in_valid and out_ready random, then release it."
    expected: "All three outputs are 0 while rst_n is 0; in_ready becomes 1 only after the first edge with rst_n 1."
    checks: ["out_valid == 0 while reset", "in_ready == 0 while reset", "out_data == 0 while reset", "out_data == 0 while low(out_valid)"]
    distinguishes: {reset_length: ["1 cycle", "2+ cycles"]}
    formal: false
  - id: VPS-02
    slug: single_word_latency
    req_ids: [REQ-3.1.2, REQ-3.1.8]
    observe: [IDD-M_OUT.out_valid]
    intent: "From empty, drive one word with in_valid 1 and out_ready 1; then drive one more with out_ready 0."
    expected: "out_valid is 1 one cycle after the accepting edge with the word on out_data."
    checks: ["out_valid == 1 within 1 cycles after xfer(in_valid)"]
    distinguishes: {out_ready_at_accept: ["0", "1"]}
    formal: false
  - id: VPS-03
    slug: order_no_loss
    req_ids: [REQ-3.1.3]
    observe: [IDD-M_OUT.out_valid]
    intent: "Random in_valid, in_data and out_ready for thousands of cycles; a scoreboard compares every released word with the accepted sequence."
    expected: "Released words equal accepted words in order, none lost, none duplicated."
    checks: ["out_valid == 1 within 1 cycles after xfer(in_valid)"]
    distinguishes: {occupancy: ["empty", "mid", "full"]}
    formal: true
  - id: VPS-04
    slug: fill_to_full
    req_ids: [REQ-3.1.1]
    observe: [IDD-S_IN.in_ready]
    intent: "From empty with out_ready 0, send 17 words with in_valid 1."
    expected: "The first 16 are accepted; in_ready is 0 after the 16th while out_ready is 0, and the 17th is not accepted."
    checks: ["in_ready == 0 within 1 cycles after xfer(in_valid) if low(out_ready)"]
    distinguishes: {words_held: ["15", "16"]}
    formal: false
  - id: VPS-05
    slug: ready_when_not_full
    req_ids: [REQ-3.1.5]
    observe: [IDD-S_IN.in_ready]
    intent: "With out_ready 0 and between 0 and 15 words held, after reset release."
    expected: "in_ready is 1 in every cycle in which fewer than 16 words are held, whatever out_ready does."
    checks: ["in_ready == 1 within 1 cycles after xfer(out_valid)"]
    distinguishes: {out_ready: ["0", "1"], words_held: ["0", "1-15"]}
    formal: false
  - id: VPS-06
    slug: simultaneous_enq_deq
    req_ids: [REQ-3.1.4]
    observe: [IDD-M_OUT.out_valid]
    intent: "With 1 to 15 words held, drive in_valid 1 and out_ready 1 for several cycles."
    expected: "A word is accepted and the oldest released at each edge, order kept, out_valid stays 1."
    checks: ["out_valid == 1 within 1 cycles after xfer(in_valid) if high(out_valid)"]
    distinguishes: {words_held: ["1", "mid", "15"]}
    formal: false
  - id: VPS-07
    slug: full_bypass_no_bubble
    req_ids: [REQ-3.1.6]
    observe: [IDD-S_IN.in_ready, IDD-M_OUT.out_valid]
    intent: "Fill the FIFO to 16 words, then drive in_valid 1 and out_ready 1 for several cycles."
    expected: "in_ready is 1 in each of these cycles, a word is accepted and one released per edge, out_valid never drops."
    checks: ["in_ready == 1 at xfer(out_valid)", "out_valid == 1 within 1 cycles after xfer(in_valid) if high(out_ready)"]
    distinguishes: {words_held: ["16"]}
    formal: true
  - id: VPS-08
    slug: comb_ready_when_full
    req_ids: [REQ-3.1.7, REQ-3.3.2]
    observe: [IDD-S_IN.in_ready]
    intent: "With 16 words held, toggle out_ready within a cycle, with in_valid 0 and 1, and change in_data."
    expected: "in_ready equals out_ready in the same cycle while full, and in_valid, in_data do not change it."
    checks: ["in_ready == 1 at xfer(out_valid)", "in_ready == 0 within 1 cycles after xfer(in_valid) if low(out_ready)"]
    distinguishes: {in_valid: ["0", "1"], out_ready: ["0", "1"]}
    formal: true
  - id: VPS-09
    slug: stall_hold
    req_ids: [REQ-3.2.1]
    observe: [IDD-M_OUT.out_valid, IDD-M_OUT.out_data]
    intent: "Present the word 0xA5A5A5A5 (2779096485), hold out_ready 0 for 1 to 20 cycles while in_valid and in_data are random; the bench compares out_data in each cycle."
    expected: "out_valid stays 1 and out_data is unchanged until out_ready is 1."
    checks: ["out_valid == 1 while stall(out_valid)", "out_data == 2779096485 while stall(out_valid)"]
    distinguishes: {stall_length: ["1", "2-19", "20+"], in_valid: ["0", "1"]}
    formal: false
  - id: VPS-10
    slug: no_comb_to_outputs
    req_ids: [REQ-3.3.1]
    observe: [IDD-M_OUT.out_valid]
    intent: "From empty, drive in_valid 1 with new in_data and vary out_ready and rst_n inputs inside a cycle."
    expected: "out_valid stays 0 in the accepting cycle and is 1 only after the edge; out_data does not follow in_data in the cycle."
    checks: ["out_valid == 0 at xfer(in_valid) if low(out_valid)", "out_valid == 1 within 1 cycles after xfer(in_valid)"]
    distinguishes: {occupancy: ["empty", "nonempty"]}
    formal: true
  - id: VPS-11
    slug: reset_mid_traffic
    req_ids: [REQ-3.2.3]
    observe: [IDD-M_OUT.out_valid]
    intent: "Hold several words, apply rst_n 0 for 1 cycle, release, with out_ready 1."
    expected: "No pre-reset word is presented; out_valid stays 0 until a new word is accepted."
    checks: ["out_valid == 0 at reset_release", "out_valid == 0 while reset"]
    distinguishes: {words_held: ["1", "mid", "16"]}
    formal: false
  - id: VPS-12
    slug: timing_200mhz
    req_ids: [REQ-6.1.1]
    observe: [IDD-S_IN.in_ready]
    intent: "Analysis evidence: static timing of the out_ready to in_ready path at 200 MHz; a simulation also toggles out_ready while full."
    expected: "No negative setup slack; in_ready follows out_ready while full."
    checks: ["in_ready == 1 at xfer(out_valid)"]
    distinguishes: {out_ready: ["0", "1"]}
    formal: false
environment:
  in_valid: "any value at any cycle"
  in_data: "any 32-bit value"
  out_ready: "any value at any cycle, not combinationally derived from in_ready"
  rst_n: "active low, changes synchronously to core_clk"
  illegal_inputs: ["out_ready driven combinationally from in_ready (combinational loop)", "rst_n changing asynchronously to core_clk"]
retired: {}
