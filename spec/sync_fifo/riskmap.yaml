riskmap: spec/sync_fifo/riskmap.yaml@v0.4
blocks:
  - id: sync_fifo
    risk: HIGH
    rationale: "Full-throughput at full needs the one combinational out_ready to in_ready arc (REQ-3.1.7) while all other input-to-output paths are forbidden (REQ-3.3.1); the full and empty boundaries and the simultaneous enqueue and dequeue are classic loss and duplication sites."
    factors: {interfaces: 2, cdc_crossings: 0, fsm_states: 0, protocol_complexity: medium, novelty: low}
    targets: {coverage: {line: 100, branch: 100, toggle: 100, fsm: 100, functional: 100}}
    formal_properties_required: [REQ-3.1.3, REQ-3.1.6, REQ-3.1.7, REQ-3.3.1, REQ-3.3.2]
    register_entries: [R-01, R-02]
register:
  - {id: R-01, block: sync_fifo, severity: HIGH, status: open, text: "The out_ready to in_ready arc can form a combinational loop or a long path with the neighbouring blocks.", mitigation: "IDD-S_IN rule R4 forbids a consumer from driving out_ready from in_ready; REQ-6.1.1 checks the path timing; formal REQ-3.3.2."}
  - {id: R-02, block: sync_fifo, severity: MEDIUM, status: open, text: "Loss or duplication at the full and empty boundaries and in the full-bypass cycle.", mitigation: "Formal proof of REQ-3.1.3 and REQ-3.1.6; scoreboard in VPS-03 with occupancy bins empty, mid, full."}
